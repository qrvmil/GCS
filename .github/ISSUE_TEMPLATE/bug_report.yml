name: Bug report
description: Report a reproducible problem in GCS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Do not include credentials, personal data,
        private robot or facility information, or large raw logs.
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction command
      description: Provide the shortest command or code sample that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "For example: Ubuntu 24.04 x86_64"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "python --version"
    validations:
      required: true
  - type: input
    id: drake
    attributes:
      label: Drake version
      placeholder: "python -c 'import pydrake; print(pydrake.__file__)'"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Minimal relevant output
      description: Paste only the relevant traceback or short log excerpt after removing sensitive data.
      render: text
  - type: checkboxes
    id: hygiene
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, personal data, and unrelated logs.
          required: true
